[tool.poetry]
name = "dicebot"
version = "2.1.3"
description = "Comrade Dicebot is a Fluxer bot for rolling dice."
authors = ["Thijs Miedema <mail@tmiedema.com>", "SomaQM"]
license = "MIT"
packages = [
    {include="dicebot", from="src"}
]

[tool.poetry.dependencies]
python = "~3.14"
numpy = "^2"
matplotlib = "^3"
lark = "^1.2.2"
fluxer-py = "^0.3.2"
setuptools = "^82.0.0"
python-dotenv = "^1.0.1"
structlog = "^25.5.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.15"
pytest = "^9.0.3"
pytest-cov = "^7.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["A", "C", "E", "F", "UP", "RUF", "I", "PL", "PTH", "TID252", "SIM"]
ignore = ["E402", "PLR2004", "PLR0913", "RUF001"]
fixable = ["C", "E", "F", "UP", "I", "PL", "RUF", "PTH", "PLC", "TID252", "SIM"]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
addopts = "--cov=dicebot --cov-report xml --cov-report term-missing --cov-fail-under=75 --cov-branch"

[tool.coverage.run]
omit = [
    "src/dicebot/bot/*",
]
